services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: consumer-spark:1.0
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./checkpoints:/opt/stream/checkpoints
    networks:
      - stream-network

  spark-worker:
    image: consumer-spark:1.0
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - .env
    volumes:
      - ./checkpoints:/opt/stream/checkpoints
    networks:
      - stream-network

networks:
  stream-network:
    external: true
    name: stream-network
